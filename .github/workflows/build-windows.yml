name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.14.7'

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting and lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

      - name: Build sermons executable
        run: uv run pyinstaller --onefile --windowed --name RecordingUploadHelper --add-data "src/sermons/*.jpg;sermons" src/sermons/__main__.py

      - name: Build lessons executable
        run: uv run pyinstaller --onefile --windowed --name LessonHelper src/lessons/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: river-city-tech-windows
          path: dist/
