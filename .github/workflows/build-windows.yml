name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting and lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

      - name: Build sermons executable
        run: uv run pyinstaller --onefile --windowed --name RecordingUploadHelper --add-data "src/sermons/*.jpg;sermons" src/sermons/__main__.py

      - name: Build lessons executable
        run: uv run pyinstaller --onefile --windowed --name LessonHelper src/lessons/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: river-city-tech-windows
          path: dist/
