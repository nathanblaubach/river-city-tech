name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14.7'

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting and lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

      - name: Build sermons executable
        run: uv run pyinstaller --onefile --windowed --name RecordingUploadHelper --add-data "src/sermons/*.jpg;sermons" src/sermons/__main__.py

      - name: Build lessons executable
        run: uv run pyinstaller --onefile --windowed --name LessonHelper src/lessons/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: river-city-tech-windows
          path: dist/
