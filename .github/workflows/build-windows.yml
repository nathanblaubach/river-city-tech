name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Check formatting and lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

      - name: Build executable
        run: uv run pyinstaller --onefile --windowed --name RecordingUploadHelper --add-data "src/sermons/*.jpg;sermons" src/sermons/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sermons-windows
          path: dist/
