name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Check formatting and lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

      - name: Build sermons executable
        run: uv run pyinstaller --onefile --windowed --name RecordingUploadHelper --add-data "src/sermons/*.jpg;sermons" src/sermons/__main__.py

      - name: Build lessons executable
        run: uv run pyinstaller --onefile --windowed --name LessonHelper src/lessons/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sermons-windows
          path: dist/
