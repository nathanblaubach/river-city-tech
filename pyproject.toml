[project]
name = "sermons"
version = "0.1.0"
description = "Reduce the amount of manual work in the recording upload process"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sermons = "sermons.__main__:main"

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pre-commit==4.5.1",
    "pyinstaller==6.18.0",
    "pytest==9.0.2",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
omit = [
    "src/sermons/__main__.py",  # Entry point, not unit testable
    "src/sermons/recording_metadata_form.py",  # GUI form, not unit testable
    "src/sermons/test.py",  # Manual test script
    "src/sermons/video_generator.py",  # Wraps ffmpeg CLI, not unit testable
]

[tool.ruff.lint]
select = ["I"]
