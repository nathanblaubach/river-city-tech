[project]
name = "sermons"
version = "0.1.0"
description = "Reduce the amount of manual work in the recording upload process"
requires-python = "==3.14.7"
dependencies = []

[project.scripts]
sermons = "sermons.__main__:main"
lessons = "lessons.__main__:main"

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pre-commit==4.6.2",
    "pyinstaller==6.22.1",
    "pytest==9.1.1",
    "pytest-cov==6.3.0",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
omit = [
    "src/**/__init__.py",
    "src/**/__main__.py",
    "src/sermons/recording_metadata_form.py",
    "src/sermons/video_generator.py",
    "src/lessons/lesson_video_file_selection_form.py"
]

[tool.ruff.lint]
select = ["I"]
